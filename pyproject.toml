[project]
name = "coordinatetbi-workspace"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "api",
    "core"
]

[tool.pytest.ini_options]
addopts = [
    "--strict-markers",
]
markers = [
    "integration: marks rests that exercise cross-module or framework integration",
]

[tool.coverage.run]
branch = true
source = [
    "api",
    "core",
]
omit = [
    "*/test/*",
    "*/conftest.py",
    "*/scripts/*",
]

[tool.coverage.report]
fail_under = 100    
show_missing = true
skip_covered = false

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"